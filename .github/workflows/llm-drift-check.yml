name: LLM lab-guide drift check

# Weekly LLM-driven scan of all lab guides for AWS console-path / service-name
# / managed-policy / AMI drift since they were last reviewed. Posts findings
# as a workflow summary; alerts on items flagged HIGH risk.
#
# Setup:
# 1. Add secret ANTHROPIC_API_KEY (Anthropic console → API keys)

on:
  schedule:
    # Mondays 06:00 UTC — pre-class delivery week kickoff
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run LLM drift check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          chmod +x automation/tools/llm-drift-check.sh
          automation/tools/llm-drift-check.sh | tee drift-report.txt

      - name: Post summary
        if: always()
        run: |
          echo "## LLM drift report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat drift-report.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: drift-report.txt
